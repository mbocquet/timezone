---
# tasks file for timezone
- name: Service facts
  ansible.builtin.service_facts:
  tags:
    - timezone
    - facts

- name: Localtime file
  ansible.builtin.file:
    src: /usr/share/zoneinfo/{{ timezone_tz }}
    dest: /etc/localtime
    state: link
  when:
    - not ansible_distribution_major_version is string
    - ansible_distribution_major_version is version('13', '>')
  notify:
    - Set timezone
    - Cron restart
  tags:
    - timezone
    - localtime

- name: Timezone file
  ansible.builtin.template:
    src: timezone.j2
    dest: /etc/timezone
    mode: "0644"
  when:
    - not ansible_distribution_major_version is string
    - ansible_distribution_major_version is version('13', '<=')
  notify:
    - Set timezone
    - Cron restart
  tags:
    - timezone
